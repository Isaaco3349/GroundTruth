[project]
name = "groundtruth"
version = "0.1.0"
description = "Citation gated coding agent on Nebius Token Factory and Tavily"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "openai>=1.40.0",
  "tavily-python>=0.5.0",
  "tavily-cli>=0.1.8",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "uvicorn>=0.30.0",
  "fastapi>=0.111.0",
  "python-dotenv>=1.0.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
]

[project.scripts]
groundtruth = "groundtruth.cli:entry"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
